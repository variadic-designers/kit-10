[package]
name = "tenner"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
extism-pdk = "1.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
base64 = "0.22"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[profile.release]
opt-level = "s"
lto = true
