[package]
name = "charter"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
extism-pdk = "1.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
base64 = "0.22"
schemars = { version = "1.2.1", optional = true }

[profile.release]
opt-level = "s"
lto = true

# `schema` gates schemars in for the wire-schema dump (see wire_schema_tests + generated/
# wire-schema.json) so the SHIPPED wasm build (built without it) never pulls schemars in.
[features]
schema = ["dep:schemars"]
