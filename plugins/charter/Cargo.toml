[package]
name = "charter"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
extism-pdk = "1.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
base64 = "0.22"
schemars = { version = "1.2.1", optional = true }
# The render wire contract — the UiNode types Charter emits — lives here, not in Charter. Charter is
# now just one interpreter that conforms to this protocol (VISION.md 1st Principle).
kit10-protocol = { git = "ssh://git@github.com/Variadic-Designs/kit10-protocol.git", tag = "v0.1.0" }

[profile.release]
opt-level = "s"
lto = true

# `schema` gates schemars in for the wire-schema dump (see wire_schema_tests + generated/
# wire-schema.json) so the SHIPPED wasm build (built without it) never pulls schemars in. It also
# turns on the protocol crate's schema derives, since the dump schematizes its types.
[features]
schema = ["dep:schemars", "kit10-protocol/schema"]
