[package]
name = "snapshot"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
extism-pdk = "1.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# All three encoders are pure Rust (verified against a wasm32-unknown-unknown build spike) --
# no vendored C anywhere in this crate. image-webp is LOSSLESS-only (VP8L); lossy WebP has no
# pure-Rust non-copyleft encoder, so that one family goes through the browser instead (see
# encode_webp_lossy's doc comment in lib.rs).
png = "0.18"
jpeg-encoder = "0.6"
image-webp = "0.2"

[profile.release]
opt-level = "s"
lto = true
