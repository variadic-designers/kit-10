<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!--
			Font Awesome is self-hosted (imported in src/routes/+layout.svelte), not loaded from a
			CDN. SvelteKit hoists the layout's bundled stylesheet into the SSR'd <head> on every route,
			so the icon webfont is present before first paint on both full loads and client-side
			navigations -- the late-icon problem the old cdnjs <link> here was placed to avoid, now
			solved same-origin with no external CDN dependency (also keeps us within COEP isolation).
		-->
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
